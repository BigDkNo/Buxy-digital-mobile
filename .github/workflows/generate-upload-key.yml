# This workflow is retained as a visible safety guard. The original workflow
# generated a new private upload key and made it available as an artifact.
# That is unsafe for an already enrolled app whose existing key is still valid.
name: Upload Key Safety Notice (generation disabled)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  do-not-regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Explain why upload key generation is disabled
        run: |
          echo "The existing BUXY DIGITAL upload key must be preserved."
          echo "No new private key is generated or published by this workflow."
          echo "See docs/ANDROID-RELEASE-CHECKLIST.md before requesting any key reset."
