# Temporary QA workflow. Produces a debug-signed APK only.
# Does not read, regenerate, or distribute any production/upload signing material.
name: BUXY DIGITAL - Android test APK

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/android-debug-apk.yml
      - capacitor.config.json
      - package.json
      - index.html
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    name: Build installable debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout proposed changes
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build web placeholder
        run: npm run build

      - name: Generate Android project
        run: npx cap add android

      - name: Set matching Android API level (without release signing)
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          path = Path('android/variables.gradle')
          content = path.read_text(encoding='utf-8')
          for key in ('compileSdkVersion', 'targetSdkVersion'):
              content, changed = re.subn(r'(?m)^(\s*' + key + r'\s*=\s*)\d+', r'\g<1>36', content, count=1)
              if changed != 1:
                  raise SystemExit(f'Missing Android configuration: {key}')
          path.write_text(content, encoding='utf-8')
          PY

      - name: Compile debug APK (Android debug signing only)
        shell: bash
        run: |
          set -euo pipefail
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
          test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Upload installable APK (no keystore)
        uses: actions/upload-artifact@v4
        with:
          name: BUXY-DIGITAL-Android-TEST-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
