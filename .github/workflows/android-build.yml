name: Build BUXY DIGITAL Android

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: npm install

      - name: Build web files
        run: npm run build

      - name: Create Android project
        run: npx cap add android

      - name: Build Android App Bundle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleDebug

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: buxy-digital-android-aab
          path: android/app/build/outputs/bundle/debug/app-debug.aab
