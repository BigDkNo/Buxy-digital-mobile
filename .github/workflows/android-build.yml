name: Build BUXY DIGITAL Android

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Test Android build preparation
        run: python3 -m unittest discover -s tests -v

      # A genuine package-lock.json must be generated and committed before
      # switching to npm ci. Do not hand-author a dependency lockfile.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build web files
        run: npm run build

      - name: Create Android project
        run: npx cap add android

      - name: Apply reviewed Android version and signing configuration
        run: python3 scripts/prepare_android.py

      - name: Restore existing upload keystore
        env:
          BUXY_KEYSTORE_BASE64: ${{ secrets.BUXY_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          : "${BUXY_KEYSTORE_BASE64:?Missing existing keystore secret}"
          umask 077
          printf '%s' "$BUXY_KEYSTORE_BASE64" | base64 --decode > android/app/buxy-upload-key.jks
          test -s android/app/buxy-upload-key.jks

      - name: Build signed Release AAB
        env:
          ORG_GRADLE_PROJECT_BUXY_STORE_PASSWORD: ${{ secrets.BUXY_KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_BUXY_KEY_ALIAS: ${{ secrets.BUXY_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_BUXY_KEY_PASSWORD: ${{ secrets.BUXY_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          : "${ORG_GRADLE_PROJECT_BUXY_STORE_PASSWORD:?Missing store password}"
          : "${ORG_GRADLE_PROJECT_BUXY_KEY_ALIAS:?Missing key alias}"
          : "${ORG_GRADLE_PROJECT_BUXY_KEY_PASSWORD:?Missing key password}"
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon bundleRelease

      - name: Upload signed Release AAB only
        uses: actions/upload-artifact@v4
        with:
          name: buxy-digital-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30
