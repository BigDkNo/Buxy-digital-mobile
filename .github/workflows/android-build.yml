name: Build BUXY DIGITAL Android

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: npm install

      - name: Build web files
        run: npm run build

      - name: Create Android project
        run: npx cap add android

      - name: Restore upload keystore
        env:
          BUXY_KEYSTORE_BASE64: ${{ secrets.BUXY_KEYSTORE_BASE64 }}
        run: |
          echo "$BUXY_KEYSTORE_BASE64" | base64 --decode > android/app/buxy-upload-key.jks

      - name: Configure release signing
        env:
          BUXY_KEYSTORE_PASSWORD: ${{ secrets.BUXY_KEYSTORE_PASSWORD }}
          BUXY_KEY_ALIAS: ${{ secrets.BUXY_KEY_ALIAS }}
          BUXY_KEY_PASSWORD: ${{ secrets.BUXY_KEY_PASSWORD }}
        run: |
          cat >> android/gradle.properties <<EOF
          BUXY_STORE_FILE=buxy-upload-key.jks
          BUXY_STORE_PASSWORD=$BUXY_KEYSTORE_PASSWORD
          BUXY_KEY_ALIAS=$BUXY_KEY_ALIAS
          BUXY_KEY_PASSWORD=$BUXY_KEY_PASSWORD
          EOF

          python3 - <<'PY'
          from pathlib import Path

          path = Path("android/app/build.gradle")
          text = path.read_text()

          marker = "android {"
          signing = """android {
              signingConfigs {
                  release {
                      storeFile file(BUXY_STORE_FILE)
                      storePassword BUXY_STORE_PASSWORD
                      keyAlias BUXY_KEY_ALIAS
                      keyPassword BUXY_KEY_PASSWORD
                  }
              }
          """

          if marker not in text:
              raise SystemExit("android block not found")

          text = text.replace(marker, signing, 1)

          old = """buildTypes {
                  release {
          """
          new = """buildTypes {
                  release {
                      signingConfig signingConfigs.release
          """

          if old not in text:
              raise SystemExit("release buildType not found")

          text = text.replace(old, new, 1)
          path.write_text(text)
          PY

      - name: Build signed Release AAB
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease

      - name: Upload Release AAB
        uses: actions/upload-artifact@v4
        with:
          name: buxy-digital-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
